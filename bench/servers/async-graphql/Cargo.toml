[package]
name = "async-graphql-bench"
version = "0.0.1"
edition.workspace = true
publish.workspace = true

[dependencies]
async-graphql = "7.2"
async-graphql-axum = "7.2"
axum = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time"] }
