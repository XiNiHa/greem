query Deep($size: Int!) {
  users(first: $size) {
    id
    friends {
      id
      friends {
        id
        friends {
          id
          friends {
            id
            friends {
              id
              friends {
                id
                friends {
                  id
                  friends {
                    id
                    friends {
                      id
                      friends {
                        id
                        friends {
                          id
                          friends {
                            id
                          }
                        }
                      }
                    }
                  }
                }
              }
            }
          }
        }
      }
    }
  }
}
