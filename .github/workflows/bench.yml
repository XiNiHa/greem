name: Bench

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: bench-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  codspeed:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: moonrepo/setup-rust@v1
        with:
          channel: stable
          cache-target: release
          bins: cargo-codspeed
      - run: cargo codspeed build -p greem-bench
      - uses: CodSpeedHQ/action@v5
        with:
          mode: simulation
          run: cargo codspeed run -p greem-bench
        env:
          GREEM_BENCH_SIZES: smallest
