[package]
name = "greem-streamed-probe"
version = "0.0.0"
edition = "2024"
publish = false
default-run = "greem-streamed-probe"

[dependencies]
futures = "=0.3.34"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
self_cell = "=1.2.2"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(escape)', 'cfg(missing)', 'cfg(wrong)'] }
