[package]
name = "greem-bench"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[lib]
bench = false

[features]
http = ["dep:axum", "greem/http", "tokio/net", "tokio/rt-multi-thread", "tokio/macros"]

[dependencies]
greem = { workspace = true }
futures = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { version = "1", features = ["rt", "time"] }
axum = { version = "0.8", optional = true }

[build-dependencies]
greem-build = { workspace = true }

[dev-dependencies]
criterion = { package = "codspeed-criterion-compat", version = "5", features = ["async_tokio"] }
http-body-util = "0.1"
tower = "0.5"

[[bin]]
name = "serve"
required-features = ["http"]

[[bench]]
name = "workloads"
harness = false
